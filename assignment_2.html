<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>My 3D Portfolio</title>

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        #info {
            position: fixed;
            top: 20px;
            left: 20px;

            padding: 12px 16px;

            background: rgba(0, 0, 0, 0.65);
            color: white;

            border-radius: 10px;

            font-size: 14px;

            z-index: 10;

            user-select: none;
        }

        #resetButton {
            position: fixed;

            bottom: 20px;
            left: 20px;

            padding: 10px 16px;

            border: none;
            border-radius: 8px;

            background: rgba(0, 0, 0, 0.7);
            color: white;

            cursor: pointer;

            font-size: 14px;

            z-index: 10;
        }

        #resetButton:hover {
            background: rgba(50, 50, 50, 0.9);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lights/RectAreaLightUniformsLib.js"></script>

</head>


<body>
    <div id="info">
        Click the front plate or top sign to zoom
    </div>

    <button id="resetButton">
        Reset View
    </button>


    <script>
        const scene = new THREE.Scene();

        scene.background = new THREE.Color(0x202020);
        const camera = new THREE.PerspectiveCamera(
            60,
            innerWidth / innerHeight,
            0.1,
            1000
        );
        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });
        renderer.setSize(
            innerWidth,
            innerHeight
        );
        renderer.setPixelRatio(
            Math.min(devicePixelRatio, 2)
        );

        renderer.outputEncoding = THREE.sRGBEncoding;

        document.body.appendChild(
            renderer.domElement
        );

        const controls = new THREE.OrbitControls(
            camera,
            renderer.domElement
        );

        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.enableZoom = true;
        controls.enableRotate = true;
        controls.enablePan = false;
        controls.minDistance = 1;
        controls.maxDistance = 30;

        const startCameraPosition = new THREE.Vector3(
            6,
            4,
            8
        );

        const startTarget = new THREE.Vector3(
            0,
            1,
            0
        );

        camera.position.copy(
            startCameraPosition
        );

        controls.target.copy(
            startTarget
        );

        THREE.RectAreaLightUniformsLib.init();

        const areaLight1 = new THREE.RectAreaLight(
            0xffffff,
            5,
            5,
            5
        );
        areaLight1.position.set(
            4,
            5,
            4
        );
        areaLight1.lookAt(
            0,
            1,
            0
        );
        scene.add(
            areaLight1
        );

        const areaLight2 = new THREE.RectAreaLight(
            0xff88aa,
            3,
            4,
            4
        );
        areaLight2.position.set(
            -4,
            3,
            2
        );
        areaLight2.lookAt(
            0,
            1,
            0
        );
        scene.add(
            areaLight2
        );
        const ambientLight = new THREE.AmbientLight(
            0xffffff,
            0.5
        );
        scene.add(
            ambientLight
        );

        let model = null;

        const loader = new THREE.GLTFLoader();
        loader.load(
            'https://apygmodeler.github.io/my-cv/3dmodels/van.glb',
            (gltf) => {
                model = gltf.scene;
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                model.position.set(
                    0,
                    0,
                    0
                );
                scene.add(model);
                createHitboxes();
            },
            undefined,
            (error) => {
                console.error(
                    'Error loading model:',
                    error
                );
            }
        );

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        const clickableObjects = [];

        const hitboxMaterial = new THREE.MeshBasicMaterial({

            color: 0xff0000,

            transparent: true,

            opacity: 0,

            depthWrite: false

        });

        function createHitboxes() {

            const hitboxMaterial = new THREE.MeshBasicMaterial({
                color: 0xff0000,
                transparent: true,
                opacity: 0.35,
                depthWrite: false
            });

            const frontGeometry = new THREE.BoxGeometry(
                2,
                1,
                1
            );
            const frontHitbox = new THREE.Mesh(
                frontGeometry,
                hitboxMaterial
            );
            frontHitbox.name = "FrontPlateHitbox";
            frontHitbox.userData.zoomTarget = "front";
            frontHitbox.position.set(
                0,
                1,
                2
            );
            model.add(frontHitbox);
            clickableObjects.push(
                frontHitbox
            );
            const topGeometry = new THREE.BoxGeometry(
                2,
                1.5,
                1
            );
            const topHitbox = new THREE.Mesh(
                topGeometry,
                hitboxMaterial
            );
            topHitbox.name = "TopSignHitbox";
            topHitbox.userData.zoomTarget = "top";
            topHitbox.position.set(
                0,
                3,
                0
            );
            model.add(topHitbox);
            clickableObjects.push(
                topHitbox
            );
            console.log(
                "Front Hitbox:",
                frontHitbox
            );
            console.log(
                "Top Hitbox:",
                topHitbox
            );
        }

        renderer.domElement.addEventListener(
            'click',
            onPick
        );

        function onPick(event) {
            const rect =
                renderer.domElement.getBoundingClientRect();
            const x =
                event.clientX - rect.left;
            const y =
                event.clientY - rect.top;
            pointer.x =
                (x / rect.width) * 2 - 1;
            pointer.y =
                -(y / rect.height) * 2 + 1;
            raycaster.setFromCamera(
                pointer,
                camera
            );
            const intersects =
                raycaster.intersectObjects(
                    clickableObjects,
                    true
                );
            if (intersects.length === 0) {
                console.log(
                    "Nothing clicked"
                );
                return;
            }
            const clickedObject =
                intersects[0].object;
            console.log(
                "Clicked:",
                clickedObject.name
            );
            if (
                clickedObject.userData.zoomTarget
                === "front"
            ) {
                console.log(
                    "Zooming to FRONT PLATE"
                );
                zoomToTarget(
                    new THREE.Vector3(
                        0,
                        1.0,
                        5
                    )
                );
            }

            if (
                clickedObject.userData.zoomTarget
                === "top"
            ) {
                console.log(
                    "Zooming to TOP SIGN"
                );
                zoomToTarget(
                    new THREE.Vector3(
                        0,
                        7,
                        0
                    )
                );
            }
        }

        let isZooming = false;
        const targetCameraPosition =
            new THREE.Vector3();
        const targetControlsPosition =
            new THREE.Vector3();
        function zoomToTarget(
            target
        ) {
            targetControlsPosition.copy(
                target
            );
            const direction =
                new THREE.Vector3();
            direction.subVectors(
                camera.position,
                target
            );

            direction.normalize();

            const zoomDistance = 3;

            targetCameraPosition
                .copy(target)
                .add(
                    direction.multiplyScalar(
                        zoomDistance
                    )
                );

            isZooming = true;

        }

        document
            .getElementById("resetButton")
            .addEventListener(
                "click",
                resetCamera
            );

        function resetCamera() {

            targetCameraPosition.copy(
                startCameraPosition
            );
            targetControlsPosition.copy(
                startTarget
            );
            isZooming = true;
        }

        function updateCamera() {
            if (!isZooming) {
                return;
            }

            camera.position.lerp(
                targetCameraPosition,
                0.08
            );

            controls.target.lerp(
                targetControlsPosition,
                0.08
            );

            const distance =
                camera.position.distanceTo(
                    targetCameraPosition
                );

            if (distance < 0.01) {
                camera.position.copy(
                    targetCameraPosition
                );

                controls.target.copy(
                    targetControlsPosition
                );

                isZooming = false;

            }

        }

        window.addEventListener(
            'resize',
            function () {
                camera.aspect =
                    innerWidth /
                    innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(
                    innerWidth,
                    innerHeight
                );
                renderer.setPixelRatio(
                    Math.min(
                        devicePixelRatio,
                        2
                    )
                );
            }
        );

        function animate(
            time
        ) {
            requestAnimationFrame(
                animate
            );

            updateCamera();
            controls.update();
            renderer.render(
                scene,
                camera
            );
        }
        animate();
    </script>
</body>
</html>
