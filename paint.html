<html>
<head>
  <title>Raster Graphics</title>
  <link rel="stylesheet" href="paint_styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="top-actions">
        <button id="clearButton">Reset</button>
      </div>
    </header>

    <section class="workspace">
      <aside class="sidebar left">
        <section class="section">
          <h2 class="section-title">Tools</h2>
          <div class="tool-grid">
            <button class="tool active" data-tool="pencil"><span class="icon">✎</span><span>ดินสอ</span></button>
            <button class="tool" data-tool="line"><span class="icon">ー</span><span>เส้น</span></button>
            <button class="tool" data-tool="rectangle"><span class="icon">▢</span><span>สี่เหลี่ยม</span></button>
            <button class="tool" data-tool="ellipse"><span class="icon">○</span><span>วงรี</span></button>
            <button class="tool" data-tool="eraser"><span class="icon">☒</span><span>ยางลบ</span></button>
          </div>
        </section>

        <section class="section">
          <div class="fill-options">
            <button class="active" data-fill="outline">โปรง</button>
            <button data-fill="filled">ทึบ</button>
          </div>
        </section>
        
      </aside>
      <div class="canvas-area">
        <div class="canvas-shell">
          <canvas id="canvas" width="300" height="300"></canvas>
        </div>
      </div>

      <aside class="sidebar right">
        <section class="section">
          <h2 class="section-title">Colors</h2>
          <div class="palette">
            <button class="color active" data-color="0,0,0" title="Black" style="background:#000000"></button>
            <button class="color" data-color="255,255,255" title="White" style="background:#ffffff"></button>
            <button class="color" data-color="255,59,48" title="Red" style="background:#ff3b30"></button>
            <button class="color" data-color="255,149,0" title="Orange" style="background:#ff9500"></button>
            <button class="color" data-color="255,204,0" title="Yellow" style="background:#ffcc00"></button>
            <button class="color" data-color="52,199,89" title="Green" style="background:#34c759"></button>
            <button class="color" data-color="0,122,255" title="Blue" style="background:#007aff"></button>
            <button class="color" data-color="88,86,214" title="Indigo" style="background:#5856d6"></button>
            <button class="color" data-color="175,82,222" title="Purple" style="background:#af52de"></button>
            <button class="color" data-color="255,45,85" title="Pink" style="background:#ff2d55"></button>
            <button class="color" data-color="139,87,42" title="Brown" style="background:#8b572a"></button>
            <button class="color" data-color="142,142,147" title="Gray" style="background:#8e8e93"></button>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">Size</h2>

          <div class="size-control">
            <button id="decreaseSize">−</button>
            <strong id="sizeValue">2 px</strong>
            <button id="increaseSize">+</button>
          </div>
        </section>

        <section class="section">
          <div class="color-preview">
            <span id="currentColor" style="background:rgb(0,0,0)"></span>
            <span id="currentTool">ดินสอ · เส้นขอบ</span>
          </div>
        </section>
      </aside>
    </section>

    <footer class="statusbar">
      <span id="positionText">x: 0, y: 0</span>
      <span>300 × 300 px</span>
    </footer>
  </main>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const imageData = ctx.createImageData(canvas.width, canvas.height);
const pixels = imageData.data;

function putPixel(x, y, r, g, b, a = 255) {
  x = Math.round(x);
  y = Math.round(y);
  if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) return;
  const idx = (y * canvas.width + x) * 4;
  pixels[idx] = r;
  pixels[idx + 1] = g;
  pixels[idx + 2] = b;
  pixels[idx + 3] = a;
}

function drawLine(x1, y1, x2, y2, r, g, b, a = 255) {
  const dx = Math.abs(x2 - x1);
  const dy = Math.abs(y2 - y1);

  if(dx > dy) {
    const m = (y2 - y1) / (x2 - x1);
    const c = y1 - m * x1;
    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
      const y = Math.round(m * x + c);
      putPixel(x, y, r, g, b, a);
    }
  } else {
    const m = (x2 - x1) / (y2 - y1);
    const c = x1 - m * y1;
    for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
      const x = Math.round(m * y + c);
      putPixel(x, y, r, g, b, a);
    }
  }
}

function drawRect(x1, y1, x2, y2, r, g, b, a = 255) {
  drawLine(x1, y1, x2, y1, r, g, b, a);
  drawLine(x2, y1, x2, y2, r, g, b, a);
  drawLine(x2, y2, x1, y2, r, g, b, a);
  drawLine(x1, y2, x1, y1, r, g, b, a);
}

function drawRectFilled(x1, y1, x2, y2, r, g, b, a = 255) {
  for (let y = y1; y <= y2; y++) {
    for (let x = x1; x <= x2; x++) {
      putPixel(x, y, r, g, b, a);
    }
  }
}

function drawEllipse(cx, cy, rx, ry, r, g, b, a = 255) {
  for (let y = -ry; y <= ry; y++) {
    for (let x = -rx; x <= rx; x++) {
      if ((x * x) / (rx * rx) + (y * y) / (ry * ry) <= 1) {
        putPixel(cx + x, cy + y, r, g, b, a);
      }
    }
  }
}

function toScaledMousePos(posX, posY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: Math.floor((posX - rect.left) * canvas.width / rect.width),
    y: Math.floor((posY - rect.top) * canvas.height / rect.height)
  };
}

let tool = 'pencil';
let fillMode = 'outline';
let isDragging = false;
let startX = 0, startY = 0, previousX = 0, previousY = 0;
let r = 0, g = 0, b = 0;
let Size = 2;
let savedPixels = [];

drawRectFilled(0, 0, canvas.width - 1, canvas.height - 1, 255, 255, 255);
ctx.putImageData(imageData, 0, 0);

function drawLineStroke(x1, y1, x2, y2, rr, gg, bb, size) {
  for (let ox = -Math.floor(size / 2); ox <= Math.floor(size / 2); ox++) {
    for (let oy = -Math.floor(size / 2); oy <= Math.floor(size / 2); oy++) {
      if (ox * ox + oy * oy <= (size * size) / 4 + 1) drawLine(x1 + ox, y1 + oy, x2 + ox, y2 + oy, rr, gg, bb);
    }
  }
}

function drawEllipseOutline(cx, cy, rx, ry, rr, gg, bb, size) {
  rx = Math.max(1, Math.abs(rx));
  ry = Math.max(1, Math.abs(ry));
  const steps = Math.max(40, Math.ceil(2 * Math.PI * Math.max(rx, ry) * 1.5));
  let lastX = cx + rx, lastY = cy;
  for (let i = 1; i <= steps; i++) {
    const angle = (i / steps) * Math.PI * 2;
    const x = cx + Math.cos(angle) * rx;
    const y = cy + Math.sin(angle) * ry;
    drawLineStroke(lastX, lastY, x, y, rr, gg, bb, size);
    lastX = x; lastY = y;
  }
}

function drawRectangleFixed(x1, y1, x2, y2, rr, gg, bb, size) {
  drawLineStroke(x1, y1, x2, y1, rr, gg, bb, size);
  drawLineStroke(x2, y1, x2, y2, rr, gg, bb, size);
  drawLineStroke(x2, y2, x1, y2, rr, gg, bb, size);
  drawLineStroke(x1, y2, x1, y1, rr, gg, bb, size);
}

function redrawShape(endX, endY, shiftKey) {
  for (let i = 0; i < pixels.length; i++) {
    pixels[i] = savedPixels[i];
  }
  let x2 = endX, y2 = endY;
  const dx = x2 - startX, dy = y2 - startY;

  if (shiftKey && (tool === 'rectangle' || tool === 'ellipse')) {
    const side = Math.max(Math.abs(dx), Math.abs(dy));
    x2 = startX + Math.sign(dx || 1) * side;
    y2 = startY + Math.sign(dy || 1) * side;
  }

  if (tool === 'line') {
    drawLineStroke(startX, startY, x2, y2, r, g, b, Size);
  } else if (tool === 'rectangle') {
    if (fillMode === 'filled') drawRectFilled(startX, startY, x2, y2, r, g, b);
    else drawRectangleFixed(startX, startY, x2, y2, r, g, b, Size);
  } else if (tool === 'ellipse') {
    const cx = Math.round((startX + x2) / 2);
    const cy = Math.round((startY + y2) / 2);
    const rx = Math.abs(x2 - startX) / 2;
    const ry = Math.abs(y2 - startY) / 2;
    if (fillMode === 'filled') drawEllipse(cx, cy, rx, ry, r, g, b);
    else drawEllipseOutline(cx, cy, rx, ry, r, g, b, Size);
  }
  ctx.putImageData(imageData, 0, 0);
}

canvas.addEventListener('mousedown', (event) => {
  const pos = toScaledMousePos(event.clientX, event.clientY);
  isDragging = true;
  startX = previousX = pos.x;
  startY = previousY = pos.y;
  if (tool === 'line' || tool === 'rectangle' || tool === 'ellipse') {
    savedPixels = [];
    for (let i = 0; i < pixels.length; i++) {
      savedPixels[i] = pixels[i];
    }
  }

  if (tool === 'pencil') {
    drawLineStroke(pos.x, pos.y, pos.x, pos.y, r, g, b, Size);
    ctx.putImageData(imageData, 0, 0);
  } else if (tool === 'eraser') {
    drawLineStroke(pos.x, pos.y, pos.x, pos.y, 255, 255, 255, Size);
    ctx.putImageData(imageData, 0, 0);
  }
});

canvas.addEventListener('mousemove', (event) => {
  const pos = toScaledMousePos(event.clientX, event.clientY);
  document.getElementById('positionText').textContent = `x: ${pos.x}, y: ${pos.y}`;
  if (!isDragging) return;

  if (tool === 'pencil') {
    drawLineStroke(previousX, previousY, pos.x, pos.y, r, g, b, Size);
    ctx.putImageData(imageData, 0, 0);
  } else if (tool === 'eraser') {
    drawLineStroke(previousX, previousY, pos.x, pos.y, 255, 255, 255, Size);
    ctx.putImageData(imageData, 0, 0);
  } else {
    redrawShape(pos.x, pos.y, event.shiftKey);
  }
  previousX = pos.x;
  previousY = pos.y;
});

canvas.addEventListener('mouseup', (event) => {
  if (!isDragging) return;
  const pos = toScaledMousePos(event.clientX, event.clientY);
  if (!['pencil', 'eraser'].includes(tool)) redrawShape(pos.x, pos.y, event.shiftKey);
  isDragging = false;
  savedPixels = [];
});

window.addEventListener('click', (event) => {
const toolButtons = document.querySelectorAll('[data-tool]');
const colorButtons = document.querySelectorAll('[data-color]');
const fillButtons = document.querySelectorAll('[data-fill]');
const plusButton = event.target.closest("#increaseSize");
const minusButton = event.target.closest("#decreaseSize");

for (let i = 0; i < toolButtons.length; i++) {

  toolButtons[i].addEventListener('click', function () {
    tool = toolButtons[i].dataset.tool;
    for (let j = 0; j < toolButtons.length; j++) {
      toolButtons[j].classList.remove('active');
    }
    toolButtons[i].classList.add('active');
    updateCurrentTool();
  });
}

for (let i = 0; i < colorButtons.length; i++) {

  colorButtons[i].addEventListener('click', function () {
    const colorText = colorButtons[i].dataset.color;
    const colorValue = colorText.split(',');

    r = colorValue[0];
    g = colorValue[1];
    b = colorValue[2];

    for (let j = 0; j < colorButtons.length; j++) {
      colorButtons[j].classList.remove('active');
    }
    colorButtons[i].classList.add('active');
    document.getElementById('currentColor').style.background =
      'rgb(' + r + ',' + g + ',' + b + ')';
  });
}

for (let i = 0; i < fillButtons.length; i++) {

  fillButtons[i].addEventListener('click', function () {
    fillMode = fillButtons[i].dataset.fill;

    for (let j = 0; j < fillButtons.length; j++) {
      fillButtons[j].classList.remove('active');
    }

    fillButtons[i].classList.add('active');
    updateCurrentTool();
  });
}

if (plusButton) {
  Size++;
  document.getElementById("sizeValue").textContent = Size + " px";
}

if (minusButton) {
  Size--;
  document.getElementById("sizeValue").textContent = Size + " px";
}

function updateCurrentTool() {
  let toolName = '';
  let fillName = '';

  if (tool === 'pencil') {
    toolName = 'ดินสอ';
  }
  else if (tool === 'line') {
    toolName = 'เส้น';
  }
  else if (tool === 'rectangle') {
    toolName = 'สี่เหลี่ยม';
  }
  else if (tool === 'ellipse') {
    toolName = 'วงรี';
  }
  else if (tool === 'eraser') {
    toolName = 'ยางลบ';
  }

  if (fillMode === 'filled') {
    fillName = 'ทึบ';
  }
  else {
    fillName = 'โปร่ง';
  }

  document.getElementById('currentTool').textContent =
    toolName + ' · ' + fillName;
}
});

window.addEventListener('keydown', (event) => {
  if (event.key === '1') document.querySelector('[data-tool="pencil"]').click();
  else if (event.key === '2') document.querySelector('[data-tool="line"]').click();
  else if (event.key === '3') document.querySelector('[data-tool="rectangle"]').click();
  else if (event.key === '4') document.querySelector('[data-tool="ellipse"]').click();
  else if (event.key === '0') document.querySelector('[data-tool="eraser"]').click();
  else if (event.key === '-') {Size--; document.getElementById('sizeValue').textContent = Size + ' px';}
  else if (event.key === '+') {Size++; document.getElementById('sizeValue').textContent = Size + ' px';}
});

document.getElementById('clearButton').addEventListener('click', () => {
  drawRectFilled(0, 0, canvas.width - 1, canvas.height - 1, 255, 255, 255);
  ctx.putImageData(imageData, 0, 0);
});
</script>
</body>
</html>
